name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compiler
        run: javac -encoding UTF-8 -d out src/*.java

      - name: Générer et analyser le journal
        env:
          MATRICULE: ${{ vars.MATRICULE }}
        run: |
          mkdir -p logs
          java -cp out GenerateurLogs "$MATRICULE" 2000 > logs/access.log
          bash scripts/analyse.sh logs/access.log --top 3
          cat rapports/*.txt

      - uses: actions/upload-artifact@v4
        with:
          name: rapport
          path: rapports/
